<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Team Task Manager</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet"/>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/login.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/admin.css"/>
  <link rel="stylesheet" href="css/employee.css"/>
</head>
<body>

  <!-- ══════════ LOGIN SCREEN ══════════ -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">Task<span>Flow</span></div>
      <div class="login-sub">Team task management, simplified.</div>

      <div class="role-tabs">
        <div class="role-tab active" onclick="Auth.selectRole('admin')">🛡️ Admin</div>
        <div class="role-tab" onclick="Auth.selectRole('employee')">👤 Employee</div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="loginUser" placeholder="Enter username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="loginPass" placeholder="Enter password"
               onkeydown="if(event.key==='Enter') Auth.login()"/>
      </div>
      <button class="btn-login" onclick="Auth.login()">Sign In →</button>

      <div class="demo-hint">
        <strong>Demo Credentials</strong><br>
        Admin: <strong>admin</strong> / <strong>admin123</strong><br>
        Employees: <strong>alice</strong>, <strong>bob</strong>, <strong>carol</strong> / <strong>pass123</strong>
      </div>
    </div>
  </div>

  <!-- ══════════ APP SHELL ══════════ -->
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">Task<span>Flow</span></div>
        <div class="topbar-role" id="roleTag"></div>
      </div>
      <div class="topbar-right">
        <span class="topbar-user" id="topbarUser"></span>
        <button class="btn-logout" onclick="Auth.logout()">Sign Out</button>
      </div>
    </header>
    <div class="page-content" id="pageContent"></div>
  </div>

  <!-- ══════════ MODAL ══════════ -->
  <div class="modal-overlay" id="modalOverlay" onclick="Modal.closeOnOverlay(event)">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- JavaScript Modules (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/employee.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
